<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css"> 
</head>

<body class="bg-light text-dark">

<div class="tab-switcher">
  <button class="tab-btn active" onclick="togglePanel('panel-add', this)">Форма добавления стекол</button>
  <button class="tab-btn" onclick="togglePanel('panel-search', this)">Поиск по стеклу</button>
  <button class="tab-btn" onclick="togglePanel('panel-glasses', this)">Отчет продаж Excel</button>
</div>

<h1 class="text-center my-4 display-5 fw-bold">Отслеживание товара</h1>

<div class="container py-5">
<div id="panel-add" style="display: none;">
  <form id="addProductForm" class="mb-4 p-4 border rounded bg-white">
 
    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <label for="brand" class="form-label">Фирма телефона:</label>
        <select id="brand" name="brand" class="form-select">
          <option value="iPhone">iPhone</option>
          <option value="Samsung">Samsung</option>
          <option value="Xiaomi">Xiaomi</option>
        </select>
      </div>
<div class="col-md-4">
  <label for="model" class="form-label">Модель телефона:</label>
  <input type="text" id="model" name="model" class="form-control" placeholder="например, 16, S24" required>
</div>
      <div class="col-md-4">
        <label for="case_type" class="form-label">Вид стекла:</label>
        <select id="case_type" name="case_type" class="form-select">
          <option value="Обычное">Обычное</option>
          <option value="5D">5D</option>
          <option value="Приватное">Приватное</option>
        </select>
      </div>
    </div>
 
    <div class="row g-3 mb-4">
      <div class="col-md-3">
        <label class="form-label">Количество:</label>
        <div class="d-flex align-items-center gap-2">
          <button type="button" class="btn btn-outline-secondary" onclick="stepQuantity(-1)">−</button>
          <input type="number" id="quantity" name="quantity" min="0" step="1" class="form-control text-center" required>
          <button type="button" class="btn btn-outline-secondary" onclick="stepQuantity(1)">+</button>
        </div>
      </div>
      <div class="col-md-6">
        <label class="form-label d-block">Магазин:</label>
        <div class="shop-option" onclick="toggleShop(this)">Fama</div>
        <div class="shop-option" onclick="toggleShop(this)">Astri</div>
        <span id="actionCheckmark" class="checkmark-icon">✓</span>
      </div>
    </div>
 
    <div class="row g-3">
      <div class="col-md-3">
        <button type="submit" class="btn btn-success w-100">Добавить</button>
      </div>
      <div class="col-md-3">
        <button type="button" class="btn btn-danger w-100" onclick="removeGlass()">Убрать</button>
      </div>
    </div>
 
  </form>
</div>
 

<!-- Форма поиска -->
<div id="panel-search" style="display: none;">
  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <label for="searchBrand" class="form-label">Поиск по фирме:</label>
      <select id="searchBrand" name="searchBrand" class="form-select">
        <option value="">Выберите...</option>
        <option value="iPhone">iPhone</option>
        <option value="Samsung">Samsung</option>
        <option value="Xiaomi">Xiaomi</option>
      </select>
    </div>
<div class="col-md-4">
  <label for="searchModel" class="form-label">Поиск по модели:</label>
  <input type="text" id="searchModel" name="searchModel" class="form-control"
         list="modelSuggestions" placeholder="Начните вводить модель...">
  <datalist id="modelSuggestions"></datalist>
</div>
    <div class="col-md-4">
      <label for="searchCaseType" class="form-label">Поиск по виду чехла:</label>
      <select id="searchCaseType" name="searchCaseType" class="form-select">
        <option value="">Выберите...</option>
        <option value="Обычное">Обычное</option>
        <option value="5D">5D</option>
        <option value="Приватное">Приватное</option>
      </select>
    </div>
  </div>
  <div class="text-center">
    <button id="advancedSearchButton" class="btn btn-success">Поиск</button>
  </div>
 
  <div class="container py-5">
    <h1 class="text-center mb-4">Управление товарами</h1>
 
<div class="row g-3 mb-4">
  <div class="col-md-6">
    <div class="filter-box">
      <div class="form-check">
        <input type="checkbox" class="form-check-input" id="onlyAvailable">
        <label class="form-check-label" for="onlyAvailable">Только в наличии</label>
      </div>
      <div class="form-check">
        <input type="checkbox" class="form-check-input" id="onlyUnvailable">
        <label class="form-check-label" for="onlyUnvailable">Только не в наличии</label>
      </div>
    </div>
  </div>
  <div class="col-md-6">
    <div class="filter-box">
      <div class="form-check">
        <input type="checkbox" class="form-check-input" id="onlyFama">
        <label class="form-check-label" for="onlyFama">Только Fama</label>
      </div>
      <div class="form-check">
        <input type="checkbox" class="form-check-input" id="onlyAstri">
        <label class="form-check-label" for="onlyAstri">Только Astri</label>
      </div>
    </div>
  </div>
</div>
 
    <!-- Таблица с товарами -->
    <div class="table-responsive mt-4">
      <table id="casesTable" class="table table-bordered table-hover">
        <thead class="table-dark">
          <tr>
            <th>Фирма</th>
            <th>Модель</th>
            <th>Вид стекла</th>
            <th>Количество</th>
            <th>Магазин</th>
          </tr>
        </thead>
        <tbody>
                    <!-- Данные будут добавляться через JavaScript -->

          </tbody>
        </table>
      </div>
    </div>
  </div>

<div id="panel-glasses" style="display: none;">
  <h2 class="text-center mb-4">Перенос продаж с фото</h2>

  <div class="mb-4 p-4 border rounded bg-white">
    <div class="upload-zone" onclick="document.getElementById('salesPhoto').click()">
      <div class="upload-zone__icon">📷</div>
      <div class="upload-zone__text">Нажми, чтобы выбрать фото листа продаж</div>
      <input type="file" id="salesPhoto" name="salesPhoto" accept="image/*" class="d-none">
    </div>

    <div id="photoPreview" class="mb-3"></div>

    <div class="text-center">
<button type="button" class="btn btn-success" id="analyzeBtn" onclick="analyzePhoto()">Распознать</button>
    </div>


    <div class="doc-header mb-3">
  <div class="doc-header__row doc-header__row--title">
    <div class="doc-header__company">Likefon OÜ</div>
    <div class="doc-header__invoice">
      Saateleht nr. <input type="text" id="docInvoice" class="doc-header__input" placeholder="44" style="width: 60px;">
    </div>
  </div>
  <div class="doc-header__row">
    <div></div>
    <div class="d-flex gap-2">
      <select id="docShop" class="doc-header__input">
        <option value="Fama">FAMA</option>
        <option value="Astri">ASTRI</option>
      </select>
      <input type="date" id="docDate" class="doc-header__input">
    </div>
  </div>
  <div class="doc-header__row">
    <div><strong>Müüja:</strong> Likefon OÜ</div>
    <div><strong>Maksja:</strong> Eraisik</div>
  </div>
  <div class="doc-header__row">
    <div><strong>IBAN:</strong> EE372200221075983753</div>
    <div><strong>Pank:</strong></div>
  </div>
</div>


<div class="table-responsive mb-3">
  <table id="resultsTable" class="excel-table">
    <thead>
      <tr>
        <th>Дата</th>
        <th>С/б</th>
        <th>Название</th>
        <th>Кол-во</th>
        <th>Цена</th>
        <th>Сумма</th>
        <th>Оплата</th>
      </tr>
    </thead>
    <tbody id="resultsTableBody">
      <!-- строки добавляются через JS -->
    </tbody>
  </table>
</div>

<div class="d-flex gap-2">
  <button type="button" class="btn btn-outline-secondary" onclick="addEmptyRow()">+ Добавить строку</button>
  <button type="button" class="btn btn-success" onclick="downloadExcel()">Скачать Excel</button>
</div>

  </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
